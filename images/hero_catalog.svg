a del catalogo -->  <ellipse cx="410" cy="210" rx="48" ry="64" fill="url(#skin4)" />  <path d="M370,160 Q410,110 450,160 Q465,240 440,280 Q390,250 370,160 Z" fill="#CBD5E1" opacity="0.9" /></g><!-- Insignia y sellos del catalogo --><rect x="40" y="360" width="520" height="60" rx="12" fill="#FFFFFF" opacity="0.92" /><text x="60" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0D47A1">Dermclar &amp; Medical Skin</text><text x="60" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Diferentes pieles. Un cuidado consciente • Catálogo Oficial 2026</text><text x="530" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0D47A1" text-anchor="end">2026</text></svg>